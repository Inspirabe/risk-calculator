<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close(true)">OK</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="p-4">
    <!-- Grote display zoals in je screenshot -->
    <div class="flex items-center justify-center gap-6 my-4">
        <!-- <ion-button fill="clear" size="large" (click)="dec()" aria-label="decrease">
        <ion-icon name="remove-outline"></ion-icon>
        </ion-button> -->

        <div class="text-6xl font-bold flex items-baseline gap-1">
        <span class="opacity-70 text-6xl">$&nbsp;</span>
        <span class="text-green-500">{{ value }}</span>
        </div>

        <!-- <ion-button fill="clear" size="large" (click)="inc()" aria-label="increase">
        <ion-icon name="add-outline"></ion-icon>
        </ion-button> -->
    </div>

  
    <ion-item lines="none" class="mt-4">
        <ion-label position="stacked">Enter amount</ion-label>
        <ion-input
        type="text"
        [value]="formatCurrency( value )"
        class="bg-gray-100 dark:bg-gray-800 rounded-md text-right"
        style="--padding-end: .75rem;"
        (ionInput)="onAmountInput($event)"
        (ionBlur)="onAmountBlur($event)"
        (ionFocus)="selectAll($event)">
        <span slot="start" class="w-5 text-[var(--ion-color-medium)]">$</span>
        </ion-input>
    </ion-item>

    <!-- Onderste overtuigingsknop zoals op je screenshot -->
    <div class="p-4">
        <ion-button expand="block" size="large" (click)="close(true)">OK</ion-button>
    </div>
</ion-content>
